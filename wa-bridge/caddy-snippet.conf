# Agregar dentro del bloque del sitio en el Caddyfile
# (el que ya tiene autbacar.dnsalias.com configurado)
#
# Acceso resultante por empresa:
#   https://autbacar.dnsalias.com/bacarsa/        <- UI + QR Bacar SA
#   https://autbacar.dnsalias.com/bacarsa/qr      <- escanear QR sesión Bacar SA
#   https://autbacar.dnsalias.com/bacarsa/status  <- estado JSON
#   https://autbacar.dnsalias.com/pruebas/        <- UI + QR Pruebas SA
#   https://autbacar.dnsalias.com/pruebas/qr      <- escanear QR sesión Pruebas SA
#   https://autbacar.dnsalias.com/pruebas/status  <- estado JSON
#
# La URL de cada empresa se configura en Configuración → WA Bridge de la plataforma.

handle /bacarsa/* {
    uri strip_prefix /bacarsa
    reverse_proxy localhost:7291
}

handle /pruebas/* {
    uri strip_prefix /pruebas
    reverse_proxy localhost:7292
}

# Retrocompatibilidad: /wabridge sigue apuntando a bacarsa
handle /wabridge/* {
    uri strip_prefix /wabridge
    reverse_proxy localhost:7291
}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tablero financiero — Ventas y cobranzas 08/2026</title>
  <style>
    :root {
      --bg: #0f172a; --bg-2: #111827; --card: #1e293b; --stroke: #334155;
      --text: #f1f5f9; --muted: #94a3b8; --indigo: #6366f1; --indigo-2: #818cf8;
      --emerald: #34d399; --amber: #fbbf24; --rose: #fb7185; --sky: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: "Segoe UI", Inter, system-ui, sans-serif; min-height: 100%; }
    body { padding: 28px 28px 64px; }
    .wrap { max-width: 1280px; margin: 0 auto; }
    .wrap.wide { max-width: 1680px; }
    header.top {
      background: var(--card); border: 1px solid var(--stroke); border-radius: 24px;
      padding: 22px 26px; box-shadow: 0 10px 30px rgba(0,0,0,.28); margin-bottom: 18px;
    }
    .kicker { color: var(--indigo-2); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 650; }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -.03em; margin-top: 4px; }
    h2 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; margin: 8px 0 12px; }
    .sub { color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 6px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .tab {
      border: 1px solid var(--stroke); background: var(--bg-2); color: var(--muted);
      border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .tab:hover { background: #1e293b; color: var(--text); }
    .tab.on { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    .panel { display: none; }
    .panel.on { display: block; }
    .grid { display: grid; gap: 14px; overflow: visible; }
    .g4 { grid-template-columns: repeat(4, 1fr); }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g2 { grid-template-columns: 1fr 1fr; }
    .card {
      background: var(--card); border: 1px solid var(--stroke); border-radius: 20px;
      padding: 16px 18px; box-shadow: 0 8px 20px rgba(0,0,0,.18);
    }
    .stat .v { font-size: 24px; font-weight: 700; letter-spacing: -.03em; }
    .stat .l { margin-top: 4px; font-size: 12px; color: var(--muted); line-height: 1.35; }
    .has-tip { position: relative; cursor: help; z-index: 1; }
    .has-tip:hover, .has-tip:focus-within { z-index: 40; }
    .tip-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; margin-left: 6px; border-radius: 99px;
      border: 1px solid #64748b; color: #94a3b8; font-size: 10px; font-weight: 700;
    }
    .tip {
      display: none; position: absolute; left: 10px; right: 10px; top: calc(100% + 8px);
      z-index: 50; background: #0b1220; border: 1px solid #6366f1; border-radius: 14px;
      padding: 10px 12px; font-size: 12px; line-height: 1.45; color: #e2e8f0;
      box-shadow: 0 12px 28px rgba(0,0,0,.45);
    }
    .tip b { color: #a5b4fc; font-weight: 650; }
    .has-tip:hover .tip, .has-tip:focus-within .tip { display: block; }
    .warn { color: var(--amber); }
    .danger { color: var(--rose); }
    .ok { color: var(--emerald); }
    .info { color: var(--sky); }
    .callout { border-radius: 20px; padding: 14px 16px; font-size: 14px; line-height: 1.5; margin: 14px 0; }
    .callout.info { background: #0b1c33; border: 1px solid #1e3a5f; color: #bfdbfe; }
    .callout.warning { background: #1a1408; border: 1px solid #854d0e; color: #fde68a; }
    details.glosario { margin-bottom: 14px; }
    details.glosario > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 700; user-select: none;
    }
    details.glosario > summary::-webkit-details-marker { display: none; }
    .glosario .lead { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 12px 0; }
    .share-stack { height: 26px; border-radius: 999px; overflow: hidden; display: flex; background: #0f172a; border: 1px solid var(--stroke); }
    .share-stack span { display: block; height: 100%; min-width: 2px; }
    .pie-wrap { display: grid; grid-template-columns: minmax(160px, 200px) 1fr; gap: 16px 20px; align-items: center; }
    .pie-chart { width: 100%; max-width: 200px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,.35)); }
    .pie-center { font-size: 11px; fill: #94a3b8; font-weight: 600; }
    .pie-center-v { font-size: 13px; fill: #f1f5f9; font-weight: 700; }
    .share-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 14px; margin-top: 12px; font-size: 12px; }
    .share-item { display: flex; gap: 8px; line-height: 1.35; color: var(--muted); }
    .share-item i { width: 10px; height: 10px; border-radius: 99px; flex-shrink: 0; margin-top: 3px; }
    .share-item b { color: var(--text); font-weight: 650; }
    .usage { height: 14px; border-radius: 999px; overflow: hidden; display: flex; background: #0f172a; border: 1px solid var(--stroke); }
    .usage span { display: block; height: 100%; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 99px; margin-right: 6px; }
    .hbar { display: grid; grid-template-columns: 240px 1fr 120px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
    .hbar .track { height: 10px; background: #0f172a; border-radius: 99px; overflow: hidden; }
    .hbar .fill { height: 100%; border-radius: 99px; }
    .hbar .val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { padding: 8px 8px; text-align: left; border-bottom: 1px solid #334155; white-space: nowrap; }
    th { color: var(--muted); font-weight: 650; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; position: sticky; top: 0; background: var(--card); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:hover { background: #243044; }
    .tbl-wrap { overflow: auto; max-height: 640px; border-radius: 12px; }
    .pill { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .pill.v { background: #06281f; color: var(--emerald); }
    .pill.c { background: #0c2a3a; color: var(--sky); }
    .pill.i { background: #1e1b4b; color: var(--indigo-2); }
    .pill.x { background: #1e293b; color: #94a3b8; }
    input, select {
      background: #0f172a; border: 1px solid var(--stroke); color: var(--text);
      border-radius: 12px; padding: 8px 12px; font-size: 13px;
    }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .sortbtn {
      border: 1px solid var(--stroke); background: #0f172a; color: var(--muted);
      border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .sortbtn.on { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    .muted { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .foot { margin-top: 22px; color: #64748b; font-size: 12px; }
    input.inc { width: 16px; height: 16px; accent-color: #6366f1; cursor: pointer; }
    table.roster tr.off { opacity: .45; }
    table.roster td.chk { width: 34px; text-align: center; }
    .btn-csv {
      border: 1px solid var(--stroke); background: #0f172a; color: var(--text);
      border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    }

  </style>

      const sign = n < 0 ? "-" : "";

      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
      document.querySelectorAll(".panel").forEach(x => x.classList.toggle("on", x.id === b.dataset.tab));
      document.querySelector(".wrap").classList.toggle("wide", b.dataset.tab === "planilla");
    });

    function renderTablero() {
      const M = ctx();
      const gap = M.cobro - M.venta;
      document.getElementById("tablero").innerHTML = `
        <details class="card glosario">
          <summary>Qué es este reporte</summary>
          <p class="lead">Asiento contable <b>ventas + cobranzas</b> del período ${esc(META.periodo || "—")}. Cada fila es un renglón de cuenta (debe/haber), no un comprobante ni un cliente. <b>Ventas netas</b> = suma haber−debe en cuentas de ingreso (base imponible). <b>Cobranzas</b> = entradas por recibos en bancos, caja y cheques (sin la contrapartida CxC).</p>
        </details>
        <div class="grid g4" style="margin-bottom:14px">
          ${stat(fmtPeso(M.venta), "Ventas netas", "ok", `<b>BASE IMPONIBLE</b><br>Suma haber − debe en ingresos.<br>FC ${fmtPeso(M.fc)} · NC ${fmtPeso(M.nc)} · ND ${fmtPeso(M.nd)}.`)}
          ${stat(fmtPeso(M.cobro), "Cobranzas (recibos)", "info", `<b>FORMAS DE PAGO · RECIBO</b><br>Entrada en bancos, caja, cheques y retenciones SUSS.<br>No incluye movimiento interno de CxC.`)}
          ${stat(fmtPeso(M.cxcAlta), "Alta CxC (facturas)", "warn", `<b>Cuentas a cobrar · debe</b><br>Facturas/ND que suben la deuda de clientes en el mes.`)}
          ${stat(fmtPeso(M.cxcPago), "Baja CxC (cobros)", "ok", `<b>Cuentas a cobrar · haber</b><br>Recibos que cancelan deuda (contrapartida contable).`)}
        </div>
        <div class="grid g4" style="margin-bottom:14px">
          ${stat(fmtPeso(gap), "Cobranzas − ventas", gap >= 0 ? "info" : "danger", `<b>Diferencia del mes</b><br>${fmtPeso(M.cobro)} cobrado vs ${fmtPeso(M.venta)} vendido.<br>Positivo = entró más efectivo que lo facturado en ingresos (cobro de deuda anterior).`)}
          ${stat(fmtPeso(M.impuesto), "IVA y retenciones", "", `<b>POSICIÓN IVA + retenciones</b><br>Renglones impositivos del asiento (${fmtPeso(M.impuesto)} neto).`)}
          ${stat(String(M.rubroArr.length), "Rubros de ingreso", "", `<b>Cuentas 41xx con venta</b><br>${M.rubroArr.length} rubros distintos en el universo.`)}
          ${stat(String(M.canalArr.length), "Canales de cobro", "", `<b>Cuentas con recibo</b><br>${M.canalArr.length} medios de cobranza.`)}
        </div>
        <div class="card" style="margin-bottom:14px">
          <h2>Ventas vs cobranzas del mes</h2>
          ${hbars([["Ventas netas", M.venta], ["Cobranzas líquidas", M.cobro]], Math.max(M.venta, M.cobro, 1), "#818cf8")}
          <p class="muted" style="margin-top:8px">Ventas = reconocimiento de ingreso. Cobranzas = plata que entró por recibos. No tienen que coincidir: se cobra deuda de meses previos.</p>
        </div>
        <div class="grid g2" style="margin-bottom:14px">
          <div class="card">
            <h2>Ventas por rubro (% del neto)</h2>
            ${pieChart(M.rubroArr.map(r => ({ cuenta: r.cod + " · " + r.cuenta, net: r.net })), M.venta, 8)}
          </div>
          <div class="card">
            <h2>Cobranzas por canal (% del cobro)</h2>
            ${pieChart(M.canalArr.map(c => ({ cuenta: c.canal, net: c.net })), M.cobro, 8)}
          </div>
        </div>
        <div class="card" style="margin-bottom:14px">
          <h2>Mix comprobantes — ventas (base imponible)</h2>
          ${hbars(Object.entries(M.byCompVenta).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, v]), Math.max(...Object.values(M.byCompVenta).map(Math.abs), 1), "#34d399")}
        </div>
        <div class="callout info"><b>Lectura rápida.</b> Seguridad privada (4119) y tesorería/recaudación concentran el ingreso. Cobranzas fuertes en Banco Provincia y Banco Julio. Para ver <b>cliente por cliente</b>, usá facturas electrónicas; este XLS es la foto contable.</div>
      `;
    }

    let rubSort = "net";
    let rubQ = "";
    function renderVentas() {
      const list = roster();
      const M = ctx();
      const allRubros = [...new Set(DOCS.filter(d => d.fam === "venta").map(rubroKey))];
      const q = rubQ.trim().toLowerCase();
      const rows = allRubros.map(k => {
        const parts = k.split("|");
        const agg = list.filter(d => d.fam === "venta" && rubroKey(d) === k);
        const net = agg.reduce((a, d) => a + d.net, 0);
        const n = agg.length;
        return { k, cod: parts[0], cuenta: parts.slice(1).join("|"), net, n, on: !excludedRubro.has(k) };
      }).filter(r => !q || r.cuenta.toLowerCase().includes(q) || r.cod.includes(q))
        .sort((a, b) => {
          if (a.on !== b.on) return a.on ? -1 : 1;
          return (b[rubSort] || 0) - (a[rubSort] || 0);
        });
      document.getElementById("ventas").innerHTML = `
        <div class="grid g3" style="margin-bottom:14px">
          ${stat(fmtPeso(M.venta), "Ventas netas incluidas", "ok", `<b>Rubros tildados</b><br>${M.rubroArr.length} rubros activos.`)}
          ${stat(fmtPeso(M.fc), "Facturas (FC)", "", `<b>Solo FC en base imponible</b>`)}
          ${stat(fmtPeso(M.nc), "Notas de crédito", "danger", `<b>NC en base imponible</b>`)}
        </div>
        <div class="toolbar">
          <input id="rq" type="search" placeholder="Buscar rubro o código…" value="${esc(rubQ)}" style="width:280px" />
          <button class="sortbtn${rubSort === "net" ? " on" : ""}" data-sort="net">Neto</button>
          <button class="sortbtn${rubSort === "n" ? " on" : ""}" data-sort="n">Renglones</button>
        </div>
        <div class="card">
          <div class="tbl-wrap">
            <table class="roster">
              <thead><tr>
                <th class="chk"></th><th>Cód.</th><th>Rubro ingreso</th><th class="num">Neto</th><th class="num">%</th><th class="num">Rengl.</th>
              </tr></thead>
              <tbody>
                ${rows.map(r => `<tr class="${r.on ? "" : "off"}">
                  <td class="chk"><input type="checkbox" class="inc" data-k="${esc(r.k)}" ${r.on ? "checked" : ""} /></td>
                  <td>${esc(r.cod)}</td><td>${esc(r.cuenta)}</td>
                  <td class="num">${fmtFull(r.net)}</td>
                  <td class="num">${pct(r.net, M.venta)}</td>
                  <td class="num">${r.n}</td>
                </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
      document.getElementById("rq").addEventListener("input", e => { rubQ = e.target.value; renderVentas(); });
      document.querySelectorAll("#ventas .sortbtn").forEach(b => b.addEventListener("click", () => { rubSort = b.dataset.sort; renderVentas(); }));
      document.querySelectorAll("#ventas .inc").forEach(cb => {
        cb.addEventListener("change", () => {
          const k = cb.getAttribute("data-k");
          if (cb.checked) excludedRubro.delete(k); else excludedRubro.add(k);
          saveExcluded(); refresh();
        });
      });
    }

    let canSort = "net";
    let canQ = "";
    function renderCobranzas() {
      const list = roster();
      const M = ctx();
      const allCanal = [...new Set(DOCS.filter(d => d.fam === "cobro").map(canalKey))];
      const q = canQ.trim().toLowerCase();
      const rows = allCanal.map(cod => {
        const sample = DOCS.find(d => d.cod === cod && d.fam === "cobro");
        const agg = list.filter(d => d.fam === "cobro" && d.cod === cod);
        const net = agg.reduce((a, d) => a + d.net, 0);
        return { cod, canal: sample ? (sample.canal || sample.cuenta) : cod, net, n: agg.length, on: !excludedCanal.has(cod) };
      }).filter(r => !q || r.canal.toLowerCase().includes(q) || r.cod.includes(q))
        .sort((a, b) => {
          if (a.on !== b.on) return a.on ? -1 : 1;
          return (b[canSort] || 0) - (a[canSort] || 0);
        });
      const totalRec = M.canalArr.reduce((a, c) => a + c.n, 0);
      document.getElementById("cobranzas").innerHTML = `
        <div class="grid g3" style="margin-bottom:14px">
          ${stat(fmtPeso(M.cobro), "Cobranzas incluidas", "info", `<b>Canales tildados</b>`)}
          ${stat(fmtPeso(M.cxcPago), "Imputado a CxC", "ok", `<b>Haber en 11201 por recibos</b><br>Contrapartida contable de los cobros.`)}
          ${stat(fmtPeso(M.cxcAlta), "Nuevas facturas CxC", "warn", `<b>Debe en 11201</b><br>Deuda generada en el mes.`)}
        </div>
        <div class="grid g2" style="margin-bottom:14px">
          <div class="card">
            <h2>Cobrado por medio (%)</h2>
            <p class="muted" style="margin-bottom:10px">Participación del monto cobrado en cada canal (bancos, caja, cheques, retenciones).</p>
            ${pieChart(M.canalArr.map(c => ({ cuenta: c.canal, net: c.net })), M.cobro, 8)}
          </div>
          <div class="card">
            <h2>Recibos por medio (%)</h2>
            <p class="muted" style="margin-bottom:10px">Cantidad de recibos imputados a cada medio — no es monto, es volumen operativo.</p>
            ${pieChart(
              M.canalArr.map(c => ({ cuenta: c.canal, n: c.n })),
              totalRec,
              8,
              { getVal: x => x.n, fmtVal: n => n + " rec." }
            )}
          </div>
        </div>
        <div class="toolbar">
          <input id="cq" type="search" placeholder="Buscar canal…" value="${esc(canQ)}" style="width:280px" />
          <button class="sortbtn${canSort === "net" ? " on" : ""}" data-sort="net">Cobrado</button>
          <button class="sortbtn${canSort === "n" ? " on" : ""}" data-sort="n">Recibos</button>
        </div>
        <div class="card">
          <div class="tbl-wrap">
            <table class="roster">
              <thead><tr>
                <th class="chk"></th><th>Cód.</th><th>Canal</th><th class="num">Cobrado</th><th class="num">%</th><th class="num">Recibos</th>
              </tr></thead>
              <tbody>
                ${rows.map(r => `<tr class="${r.on ? "" : "off"}">
                  <td class="chk"><input type="checkbox" class="inc" data-k="${esc(r.cod)}" ${r.on ? "checked" : ""} /></td>
                  <td>${esc(r.cod)}</td><td>${esc(r.canal)}</td>
                  <td class="num">${fmtFull(r.net)}</td>
                  <td class="num">${pct(r.net, M.cobro)}</td>
                  <td class="num">${r.n}</td>
                </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
      document.getElementById("cq").addEventListener("input", e => { canQ = e.target.value; renderCobranzas(); });
      document.querySelectorAll("#cobranzas .sortbtn").forEach(b => b.addEventListener("click", () => { canSort = b.dataset.sort; renderCobranzas(); }));
      document.querySelectorAll("#cobranzas .inc").forEach(cb => {
        cb.addEventListener("change", () => {
          const k = cb.getAttribute("data-k");
          if (cb.checked) excludedCanal.delete(k); else excludedCanal.add(k);
          saveExcluded(); refresh();
        });
      });
    }

    let planQ = "";
    let planFam = "";
    function renderPlanilla() {
      const list = roster();
      const q = planQ.trim().toLowerCase();
      const fams = ["", "venta", "cobro", "cxc_alta", "cxc_pago", "impuesto", "otro"];
      const filtered = list.filter(d => {
        if (planFam && d.fam !== planFam) return false;
        if (!q) return true;
        return [d.cod, d.cuenta, d.tipoC, d.tipoComp, d.fam, d.comp].join(" ").toLowerCase().includes(q);
      });
      document.getElementById("planilla").innerHTML = `
        <div class="toolbar">
          <input id="pq" type="search" placeholder="Buscar cuenta, tipo, comprobante…" value="${esc(planQ)}" style="width:320px" />
          <select id="pf">
            ${fams.map(f => `<option value="${f}"${planFam === f ? " selected" : ""}>${f ? f : "Todas las familias"}</option>`).join("")}
          </select>
          <button type="button" class="btn-csv" id="csvBtn">Export CSV</button>
          <span class="muted">${filtered.length} / ${list.length} renglones</span>
        </div>
        <div class="card">
          <div class="tbl-wrap">
            <table>
              <thead><tr>
                <th>#</th><th>Cód.</th><th>Cuenta</th><th>Familia</th><th>Comprob.</th><th class="num">Debe</th><th class="num">Haber</th><th class="num">Neto</th>
              </tr></thead>
              <tbody>
                ${filtered.map(d => `<tr>
                  <td>${d.i}</td><td>${esc(d.cod)}</td><td>${esc(d.cuenta)}</td>
                  <td><span class="pill ${d.fam === "venta" ? "v" : d.fam === "cobro" ? "c" : d.fam === "impuesto" ? "i" : "x"}">${esc(d.fam)}</span></td>
                  <td>${esc(d.tipoComp)}</td>
                  <td class="num">${fmtFull(d.debe)}</td><td class="num">${fmtFull(d.haber)}</td><td class="num">${fmtFull(d.net)}</td>
                </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
      document.getElementById("pq").addEventListener("input", e => { planQ = e.target.value; renderPlanilla(); });
      document.getElementById("pf").addEventListener("change", e => { planFam = e.target.value; renderPlanilla(); });
      document.getElementById("csvBtn").addEventListener("click", () => {
        const hdr = ["i","cod","cuenta","fam","tipoC","tipoComp","debe","haber","net"];
        const lines = [hdr.join(";")].concat(filtered.map(d => hdr.map(h => String(d[h] ?? "")).join(";")));
        const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "ventas-cobranzas-reporte-272.csv";
        a.click();
      });
    }

    function refresh() {
      const M = ctx();
      const sub = document.getElementById("subline");
      if (sub) {
        sub.textContent = `Reporte N° ${META.reporte || "272"} · ${META.titulo || "Ventas y cobranzas"} · efecto ${META.periodo || "—"} · ${M.n} renglones · ventas ${fmtPeso(M.venta)} · cobranzas ${fmtPeso(M.cobro)}`;
      }
      const onTab = document.querySelector(".tab.on");
      const tabId = onTab ? onTab.dataset.tab : "tablero";
      renderTablero();
      renderVentas();
      renderCobranzas();
      renderPlanilla();
      if (tabId && tabId !== "tablero") {
        document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.tab === tabId));
        document.querySelectorAll(".panel").forEach(x => x.classList.toggle("on", x.id === tabId));
        document.querySelector(".wrap").classList.toggle("wide", tabId === "planilla");
      }
    }
    refresh();
  </script>
</body>
</html>
